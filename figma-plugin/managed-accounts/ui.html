<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #fff;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    p  { font-size: 12px; color: #aaa; text-align: center; max-width: 240px; line-height: 1.5; }
    button {
      background: #859fff;
      color: #0d1829;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      transition: opacity .15s;
    }
    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status { font-size: 11px; color: #859fff; min-height: 16px; }
  </style>
</head>
<body>
  <h2>IDIRA — Managed Accounts</h2>
  <p>Builds the full Risk Management page as a Figma frame using DS tokens and component patterns.</p>
  <button id="btn" onclick="build()">Build Screen</button>
  <span id="status"></span>

  <script>
    function build() {
      document.getElementById('btn').disabled = true;
      document.getElementById('status').textContent = 'Building…';
      parent.postMessage({ pluginMessage: { type: 'build' } }, '*');
    }
    window.onmessage = (e) => {
      const msg = e.data.pluginMessage;
      if (!msg) return;
      if (msg.type === 'done') {
        document.getElementById('status').textContent = '✓ Done — frame created!';
        document.getElementById('btn').disabled = false;
        document.getElementById('btn').textContent = 'Build Again';
      }
      if (msg.type === 'error') {
        document.getElementById('status').textContent = '✗ ' + msg.message;
        document.getElementById('btn').disabled = false;
      }
    };
  </script>
</body>
</html>
